[package]
name = "lock-in-amp"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = {version ="0.14.0", features = ["canvas"] }
iced_plot = "0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"
open = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
